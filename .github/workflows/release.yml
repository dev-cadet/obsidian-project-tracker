name: Release

# Manual only. Pick a version here and the workflow does the rest: bump the
# files that carry it, build, test, tag, and publish. Nothing about a release is
# edited or uploaded by hand, which is what makes the published assets provably
# the ones this source builds.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (no v prefix)"
        required: true
        type: string
      summary:
        description: "One line about this release. Appears above the generated notes."
        required: false
        type: string

permissions:
  contents: write # commit the bump, push the tag, publish the release
  id-token: write # sign the provenance attestation
  attestations: write # attach it to the assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # These majors run on Node 24. The v4/v5 lines target Node 20, which the
      # runners now force onto 24 and warn about.
      - uses: actions/checkout@v7

      # Pins the runtime that builds the release. sass sets the real floor at
      # 20.19; this matches the machine the plugin is developed on.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Inputs go through the environment rather than into the script line:
      # ${{ }} is substituted before bash parses the command.
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: node version-bump.mjs "$VERSION"

      - name: Refuse to reuse a tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. A re-review needs a new version."
            exit 1
          fi

      # Both before anything is committed, so a failure leaves no tag, no commit
      # and no half-published release to clean up.
      - run: npm run build
      - run: npm test

      - name: Commit, tag and push
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json main.js styles.css
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin "HEAD:$BRANCH"
          git push origin "$VERSION"

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      # The three files the installer fetches by name, as individual assets.
      #
      # --notes with --generate-notes is not a conflict: the API pre-pends the
      # body to the notes it generates, so the summary reads as a lead paragraph
      # above the commit list. Omitted entirely when nothing was typed, rather
      # than pre-pending a blank line.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          if [ -n "$SUMMARY" ]; then
            gh release create "$VERSION" \
              main.js manifest.json styles.css \
              --title "$VERSION" \
              --notes "$SUMMARY" \
              --generate-notes
          else
            gh release create "$VERSION" \
              main.js manifest.json styles.css \
              --title "$VERSION" \
              --generate-notes
          fi
